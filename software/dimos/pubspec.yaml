name: dimos
description: "Application which runs on the dashboard of the UBC Formula Electric team."
publish_to: 'none'
version: 0.1.0

environment:
  # Pinned to Flutter 3.38.3 (Dart 3.10.x) to match the Yocto build
  # (meta-flutter FLUTTER_SDK_TAG). Resolving pubspec.lock with a newer Flutter
  # breaks `pub get --enforce-lockfile` there. Pub ignores upper bounds on the
  # flutter constraint, so the Dart range is what actually enforces this.
  sdk: ">=3.10.0 <3.11.0"
  flutter: 3.38.3

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  flutter_svg: ^2.0.17
  provider: ^6.1.2
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fe_logo.svg
    # Optional fault "screenshots" (screenshot-imd/bspd/bms.png); see FaultShot.
    - assets/fun/
