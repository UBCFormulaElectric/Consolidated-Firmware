name: tracksight-docker
services:
  influx:
    extends:
      file: ../common.yml
      service: influx
  backend:
    depends_on:
      influx:
        condition: service_healthy
    extends:
      file: ../common.yml
      service: backend
  frontend:
    extends:
      file: ../common.yml
      service: frontend
    command:
      [
        "npm",
        "start"
     ]

volumes:
  influxdb: